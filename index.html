<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskMate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>TaskMate</h1>
    <p>Manage your daily tasks easily</p>

    <div class="input-box">
        <input id="taskInput" type="text" placeholder="Enter your task">
        <select id="priority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>
        <button onclick="addTask()">Add</button>
    </div>

    <div class="stats">
        <span>Total: <b id="total">0</b></span>
        <span>Completed: <b id="completed">0</b></span>
        <span>Pending: <b id="pending">0</b></span>
    </div>

    <ul id="taskList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
